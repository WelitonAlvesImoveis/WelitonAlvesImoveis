<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" sizes="32x32" href="../assets/fav/favicon-32x32.png">
    <link rel="icon" type="image/x-icon" sizes="16x16" href="../assets/fav/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" sizes="180x180" href="../assets/fav/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" sizes="192x192" href="../assets/fav/android-chrome-192x192.png">
    <link rel="icon" type="image/x-icon" sizes="512x512" href="../assets/fav/android-chrome-512x512.png">

    <title>Login Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <h1>Login</h1>

        <form id="login-form">
          <div class="form-group">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Senha</label>
            <input type="password" id="password" class="form-control" required />
          </div>

          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <p id="login-message" class="form-message" role="alert" aria-live="polite"></p>
      </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
