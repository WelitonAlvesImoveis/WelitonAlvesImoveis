<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" sizes="32x32" href="assets/fav/favicon-32x32.png">
    <link rel="icon" type="image/x-icon" sizes="16x16" href="assets/fav/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" sizes="180x180" href="assets/fav/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" sizes="192x192" href="assets/fav/android-chrome-192x192.png">
    <link rel="icon" type="image/x-icon" sizes="512x512" href="assets/fav/android-chrome-512x512.png">

    <title>Detalhes do Imóvel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/property.css" />
  </head>
  <body class="property-shell">
    <header class="property-header">
      <div class="container property-header__content">
        <a href="./index.html" class="back-link">Voltar para Imóveis</a>

        <div class="property-header__copy">
          <h1>Detalhes do Imóvel</h1>
        </div>
      </div>
    </header>

    <main class="container property-page">
      <p id="loading" class="feedback-message">Carregando imóvel...</p>
      <p id="error-message" class="feedback-message feedback-error hidden"></p>

      <section id="property-details" class="property-layout hidden">
        <div class="property-visuals">
          <div class="gallery-card">
            <div class="gallery-stage">
              <img
                id="main-image"
                src="./assets/placeholder.jpg"
                alt="Imagem do imóvel"
                class="main-image"
              />

              <button
                type="button"
                id="gallery-prev"
                class="gallery-nav gallery-nav--prev"
                aria-label="Imagem anterior"
              >
                <span aria-hidden="true">&lsaquo;</span>
              </button>

              <button
                type="button"
                id="gallery-next"
                class="gallery-nav gallery-nav--next"
                aria-label="Próxima imagem"
              >
                <span aria-hidden="true">&rsaquo;</span>
              </button>
            </div>

            <div id="thumbnail-list" class="thumbnail-list"></div>
          </div>
        </div>

        <aside class="property-info">
          <div class="property-info-card">
            <div class="property-info-head">
              <h2 id="property-title"></h2>
              <p id="property-price" class="price"></p>
            </div>

            <ul class="property-facts">
              <li class="property-fact">
                <span class="property-fact__icon" aria-hidden="true">◎</span>
                <div class="property-fact__body">
                  <span class="property-fact__label">Localização</span>
                  <p id="property-location" class="property-fact__value"></p>
                </div>
              </li>

              <li class="property-fact">
                <span class="property-fact__icon" aria-hidden="true">⌂</span>
                <div class="property-fact__body">
                  <span class="property-fact__label">Endereço</span>
                  <p id="property-address" class="property-fact__value"></p>
                </div>
              </li>
            </ul>

            <section class="description-box">
              <h3>Descrição</h3>
              <p id="property-description"></p>
            </section>
          </div>

          <section id="property-video-card" class="property-video-card hidden">
            <span class="property-eyebrow property-eyebrow--soft">
              Mídia Complementar
            </span>
            <h3>Vídeo do Imóvel</h3>

            <div class="property-video-frame">
              <iframe
                id="property-video-iframe"
                title="Vídeo do imóvel"
                src=""
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <script src="./js/config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/youtube-utils.js"></script>
    <script src="./js/property.js"></script>
  </body>
</html>
